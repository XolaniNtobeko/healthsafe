services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: healthsafe-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  healthsafe-app:
    build: .
    container_name: healthsafe-app
    ports:
      - "7002:7000"
    depends_on:
      rabbitmq:
        condition: service_healthy